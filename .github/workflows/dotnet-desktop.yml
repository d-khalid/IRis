name: IRis CI Workflow

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

env:
  DOTNET_VERSION: '9.0.x'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test --configuration Release --no-build

  build-windows:
    runs-on: windows-latest
    needs: build
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Publish Windows
      run: dotnet publish --configuration Release --runtime win-x64 --self-contained --output ./publish-win

    - name: Upload Windows Build
      uses: actions/upload-artifact@v4
      with:
        name: IRis-Windows
        path: ./publish-win

  build-linux:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Publish Linux
      run: dotnet publish --configuration Release --runtime linux-x64 --self-contained --output ./publish-linux

    - name: Upload Linux Build
      uses: actions/upload-artifact@v4
      with:
        name: IRis-Linux
        path: ./publish-linux
